    <script type="text/javascript">
        let myDate = new Date();
        let myDay = myDate.getDay();

        // Array of days. 
        let weekday = ['Sunday', 'Monday', 'Tuesday',
            'Wednesday', 'Thursday', 'Friday', 'Saturday'
        ];
        document.write("Today is : " + weekday[myDay]);
        document.write("<br/>");

        // get hour value. 
        let hours = myDate.getHours();
        let ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        let minutes = myDate.getMinutes();
        minutes = minutes < 10 ? '0' + minutes : minutes;
        let myTime = hours + " " + ampm + " : " + minutes +
            " : " + myDate.getMilliseconds();
        document.write("\tCurrent time is : " + myTime); 
    </script>

    <!-- Jumbotron Section -->
    <div class="jumbotron">
        <h1 class="display-4">CLOCK</h1>
        <p class="lead">"The clock is ticking—what are you doing with your time?"</p>
        <div id="clock" class="clock"></div> <!-- Time will be updated here -->

        <!-- Time Zone Selector -->

            <option value="Asia/Karachi">Karachi (PKT)</option>

    <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.34/moment-timezone-with-data.js"></script>

    <script>
        // Function to update the clock and date
        function updateClock() {
            const timezone = document.getElementById('timezone-select').value; // Get selected timezone
            const now = moment().tz(timezone); // Get current time in selected timezone
            const timeString = now.format('HH:mm:ss'); // Get time in HH:mm:ss format
            const dateString = now.format('dddd, MMMM Do YYYY'); // Get date in full format

            // Update the clock and date on the page
            document.getElementById('clock').innerHTML = timeString; // Display current time
            document.getElementById('date').innerHTML = dateString; // Display current date
        }

        // Event listener to update the clock when the time zone is changed
        document.getElementById('timezone-select').addEventListener('change', updateClock);

        // Update the clock every second
        setInterval(updateClock, 1000);

        // Call updateClock once immediately on page load
        updateClock();
